<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Basics</title>
</head>

<body>

    <h1>JavaScript Basic Practice</h1>

    <p>Open the browser Console using F12 → Console to see the output.</p>

    <script>

        // What is JavaScript?
        
        // JavaScript is a programming language used
        // to make web pages interactive and dynamic.


        // ==========================================
        // Simple JavaScript Script
        // ==========================================

        console.log("Hello JavaScript");


        // ==========================================
        // Print Hello JS
        // ==========================================

        console.log("Hello JS");


        // ==========================================
        // Name and Age
        // ==========================================

        console.log("Name: Akash");
        console.log("Age: 25");


        // ==========================================
        // Single-Line Comment
        // ==========================================

        // This is a single-line comment.


        /*
            ==========================================
            Multi-Line Comment
            ==========================================

            This is a multi-line comment.
            It can contain multiple lines.
        */


        // ==========================================
        // Variables: var, let and const
        // ==========================================

        var city = "Chennai";

        let course = "JavaScript";

        const country = "India";

        console.log(city);
        console.log(course);
        console.log(country);


        // ==========================================
        // JavaScript Data Types
        // ==========================================

        // String
        let name = "Akash";

        // Number
        let age = 25;

        // Boolean
        let isStudent = true;

        // Null
        let address = null;

        // Undefined
        let phone;


        // Display values in Console

        console.log("Name:", name);
        console.log("Age:", age);
        console.log("Student:", isStudent);
        console.log("Address:", address);
        console.log("Phone:", phone);


        // ==========================================
        // Check Data Types
        // ==========================================

        console.log(typeof name);       // string
        console.log(typeof age);        // number
        console.log(typeof isStudent);  // boolean
        console.log(typeof address);     // object
        console.log(typeof phone);       // undefined

    </script>

</body>

</html>
