<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Operators</title>
</head>

<body>

    <h1>JavaScript Operators and Switch</h1>

    <script>

        // ==========================================
        // 1. Arithmetic Operators
        // ==========================================

        let a = 20;
        let b = 5;

        console.log("Addition:", a + b);       // 25
        console.log("Subtraction:", a - b);   // 15
        console.log("Multiplication:", a * b); // 100
        console.log("Division:", a / b);       // 4
        console.log("Modulus:", a % b);        // 0


        // ==========================================
        // 2. Comparison Operators
        // ==========================================

        let x = 10;
        let y = "10";

        console.log("10 == '10':", x == y);
        console.log("10 === '10':", x === y);


        // == checks only value
        // === checks value AND data type


        // ==========================================
        // 3. Logical Operators
        // ==========================================

        let age = 25;
        let hasID = true;

        // AND (&&)
        console.log("AND:", age >= 18 && hasID == true);

        // OR (||)
        console.log("OR:", age >= 18 || hasID == false);


        // ==========================================
        // 4. Positive or Negative Number
        // ==========================================

        let number = -10;

        if (number > 0) {
            console.log("The number is Positive");
        }
        else if (number < 0) {
            console.log("The number is Negative");
        }
        else {
            console.log("The number is Zero");
        }


        // ==========================================
        // 5. Switch - Days of the Week
        // ==========================================

        let day = 3;

        switch (day) {

            case 1:
                console.log("Monday");
                break;

            case 2:
                console.log("Tuesday");
                break;

            case 3:
                console.log("Wednesday");
                break;

            case 4:
                console.log("Thursday");
                break;

            case 5:
                console.log("Friday");
                break;

            case 6:
                console.log("Saturday");
                break;

            case 7:
                console.log("Sunday");
                break;

            default:
                console.log("Invalid day number");

        }

    </script>

</body>

</html>
