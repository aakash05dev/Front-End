<!DOCTYPE html>
<html>
<head>
  <title>Loop Programs - Arrow Functions</title>
</head>
<body>
  <h1>Loop Programs Arrow Function</h1>

  <script>
    // 1. Series 1 to 20
    const series1to20 = () => { for(let i=1;i<=20;i++) console.log(i); };

    // 2. Odd series
    const oddSeries = () => { for(let i=1;i<=20;i+=2) console.log(i); };

    // 3. Even series
    const evenSeries = () => { for(let i=0;i<=20;i+=2) console.log(i); };

    // 4. Multiples of 5
    const fiveSeries = () => { for(let i=0;i<=25;i+=5) console.log(i); };

    // 5. Sum of 1..n
    const sumSeries = (n=10) => { let sum=0; for(let i=1;i<=n;i++) sum+=i; console.log(sum); };

    // 6. Sum of even numbers
    const sumEven = (n=10) => { let sum=0; for(let i=0;i<=n;i+=2) sum+=i; console.log(sum); };

    // 7. Sum of odd numbers
    const sumOdd = (n=10) => { let sum=0; for(let i=1;i<=n;i+=2) sum+=i; console.log(sum); };

    // 8. Sum of multiples of 5
    const sumFive = (n=25) => { let sum=0; for(let i=0;i<=n;i+=5) sum+=i; console.log(sum); };

    // 9. Series: i / i!
    const factorial = n => { let f=1; for(let i=1;i<=n;i++) f*=i; return f; };
    const seriesFactorial = (n=5) => { let sum=0; for(let i=1;i<=n;i++) sum+=i/factorial(i); console.log(sum); };

    // 10. Even / factorial
    const evenFactorialSeries = (n=6) => { let sum=0; for(let i=0;i<=n;i+=2) sum+=i/factorial(i); console.log(sum); };

    // 11. Odd / factorial
    const oddFactorialSeries = (n=5) => { let sum=0; for(let i=1;i<=n;i+=2) sum+=i/factorial(i); console.log(sum); };

    // 12. Factorial of a number
    const factNum = n => { console.log(factorial(n)); };

    // 13. Prime check
    const isPrime = n => { if(n<2) return false; for(let i=2;i<=Math.sqrt(n);i++) if(n%i===0) return false; return true; };
    const checkPrime = n => console.log(isPrime(n) ? "Prime" : "Not Prime");

    // 14. Prime series
    const primeSeries = (n=50) => { for(let i=2;i<=n;i++) if(isPrime(i)) console.log(i); };

    // 15. Armstrong check
    const isArmstrong = n => { let str=n.toString(), sum=0; for(let ch of str) sum+=Math.pow(+ch,str.length); return sum===n; };
    const checkArmstrong = n => console.log(isArmstrong(n) ? "Armstrong" : "Not Armstrong");

    // 16. Armstrong series
    const armstrongSeries = (n=1000) => { for(let i=1;i<=n;i++) if(isArmstrong(i)) console.log(i); };

    // 17. Fibonacci
    const fibonacci = (n=10) => { let a=0,b=1; console.log(a,b); for(let i=2;i<n;i++){ let c=a+b; console.log(c); a=b; b=c; } };

    // 18. 5 Table
    const table5 = () => { for(let i=1;i<=10;i++) console.log(`${i} * 5 = ${i*5}`); };

    // 19. Sum of digits
    const sumDigits = n => { let sum=0; while(n>0){ sum+=n%10; n=Math.floor(n/10); } console.log(sum); };

    // 20. Palindrome check
    const isPalindrome = str => str === str.split("").reverse().join("");
    const checkPalindrome = str => console.log(isPalindrome(str) ? "Palindrome" : "Not Palindrome");

    // Run all
    series1to20();
    oddSeries();
    evenSeries();
    fiveSeries();
    sumSeries(10);
    sumEven(10);
    sumOdd(10);
    sumFive(25);
    seriesFactorial(5);
    evenFactorialSeries(6);
    oddFactorialSeries(5);
    factNum(5);
    checkPrime(17);
    primeSeries(50);
    checkArmstrong(153);
    armstrongSeries(500);
    fibonacci(10);
    table5();
    sumDigits(12345);
    checkPalindrome("MALAYALAM");
    checkPalindrome("HELLO");
  </script>
</body>
</html>
