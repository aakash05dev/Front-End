<h2>HTML Elements by Query Selector</h2>

<p>Finding HTML Elements by Query Selector</p>

<p class="intro">Hello World!.</p>
<p class="intro">Welcome to India.</p>
<p class="intro">Welcome to Java Script DOM.</p>
<p class="intro">Welcome to Chennai.</p>

<p id="demo"></p>

<script>
const x = document.querySelectorAll("p.intro");
document.getElementById("demo").innerHTML = 'The Third paragraph (index 2) with class="intro" is: ' + x[2].innerHTML;
</script>

<p>class & id used in second sample</p>
 <div id="samp">
        <p>This is paragraph 1.</p>
        <p>This is paragraph 2.</p>
    </div>

<p id="demo1"></p>
<script>    
     let y = document.getElementById("samp").querySelectorAll("p");
document.getElementById("demo1").innerHTML = "from inside the div tag text of the paragraph 1 is: " + y[1].innerHTML;

</script>

</body>
