<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Callback Functions</title>
</head>
<body>


    <script>

        // 1. calculate() - Addition
        function calculate(a, b, callback) {
            return callback(a, b);
        }

        function add(x, y) {
            return x + y;
        }

        console.log("1. Addition:", calculate(10, 20, add));


        // 2. greetUser() - Welcome Message
        function greetUser(name, callback) {
            callback(name);
        }

        function welcome(name) {
            console.log("2. Welcome, " + name + "!");
        }

        greetUser("Akash", welcome);


        // 3. processArray() - Double Each Element
        function processArray(arr, callback) {
            return arr.map(callback);
        }

        function double(num) {
            return num * 2;
        }

        console.log(
            "3. Doubled Array:",
            processArray([1, 2, 3, 4, 5], double)
        );


        // 4. filterNumbers() - Positive Numbers
        function filterNumbers(arr, callback) {
            return arr.filter(callback);
        }

        function isPositive(num) {
            return num > 0;
        }

        console.log(
            "4. Positive Numbers:",
            filterNumbers([-5, 10, -2, 8, 15], isPositive)
        );


        // 5. findNumber() - First Even Number
        function findNumber(arr, callback) {
            return arr.find(callback);
        }

        function isEven(num) {
            return num % 2 === 0;
        }

        console.log(
            "5. First Even Number:",
            findNumber([1, 3, 7, 8, 10, 12], isEven)
        );


        // 6. removeNegative() - Remove Negative Values
        function removeNegative(arr, callback) {
            return arr.filter(callback);
        }

        function notNegative(num) {
            return num >= 0;
        }

        console.log(
            "6. Without Negative Values:",
            removeNegative([-10, 20, -5, 30, 40], notNegative)
        );


        // 7. checkEligibility() - Voting Eligibility
        function checkEligibility(age, callback) {
            callback(age);
        }

        function checkAge(age) {
            if (age >= 18) {
                console.log("7. Eligible to vote");
            } else {
                console.log("7. Not eligible to vote");
            }
        }

        checkEligibility(20, checkAge);


        // 8. orderFood() - setTimeout and Callback
        function orderFood(callback) {
            console.log("8. Food ordered...");

            setTimeout(function () {
                callback();
            }, 3000);
        }

        function foodReady() {
            console.log("8. Food is ready");
        }

        orderFood(foodReady);


        // 9. sumArray() - Total Sum
        function sumArray(arr, callback) {
            return callback(arr);
        }

        function calculateSum(arr) {
            let sum = 0;

            for (let num of arr) {
                sum += num;
            }

            return sum;
        }

        console.log(
            "9. Total Sum:",
            sumArray([10, 20, 30, 40], calculateSum)
        );


        // 10. sortArray() - Ascending Order
        function sortArray(arr, callback) {
            return callback(arr);
        }

        function ascending(arr) {
            return arr.sort(function (a, b) {
                return a - b;
            });
        }

        console.log(
            "10. Ascending Order:",
            sortArray([50, 10, 40, 20, 30], ascending)
        );

    </script>

</body>
<h1> JS Callback Functions </h1>
</html>
