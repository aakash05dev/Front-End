<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body>

    <h1>Registration Form</h1>

    <form action="/submit" method="post">

        <!-- Name -->
        <label for="name">Full Name:</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required>

        <br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required>

        <br><br>

        <!-- Password -->
        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            minlength="6"
            required>

        <br><br>

        <!-- Gender -->
        <label>Gender:</label>

        <input
            type="radio"
            id="male"
            name="gender"
            value="Male"
            required>

        <label for="male">Male</label>

        <input
            type="radio"
            id="female"
            name="gender"
            value="Female">

        <label for="female">Female</label>

        <input
            type="radio"
            id="other"
            name="gender"
            value="Other">

        <label for="other">Other</label>

        <br><br>

        <!-- Hobbies -->
        <label>Hobbies:</label>

        <input
            type="checkbox"
            id="coding"
            name="hobbies"
            value="Coding">

        <label for="coding">Coding</label>

        <input
            type="checkbox"
            id="reading"
            name="hobbies"
            value="Reading">

        <label for="reading">Reading</label>

        <input
            type="checkbox"
            id="sports"
            name="hobbies"
            value="Sports">

        <label for="sports">Sports</label>

        <input
            type="checkbox"
            id="music"
            name="hobbies"
            value="Music">

        <label for="music">Music</label>

        <br><br>

        <!-- Age -->
        <label for="age">Age:</label>
        <input
            type="number"
            id="age"
            name="age"
            placeholder="Enter your age"
            min="18"
            max="60"
            required>

        <br><br>

        <!-- City -->
        <label for="city">City:</label>

        <input
            type="text"
            id="city"
            name="city"
            placeholder="Enter your city">

        <br><br>

        <!-- Submit -->
        <input type="submit" value="Register">

        <!-- Reset -->
        <input type="reset" value="Clear">

    </form>

</body>

</html>
