<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Selectors Example</title>

<style>
/* Element Selector */
p{
    color:#555;
    line-height:1.6;
}

/* Class Selector */
.intro{
    font-style:italic;
}

/* Class Selector */
.highlight{
    background-color:#f0f8ff;
    padding:8px;
}

/* ID Selector */
#header{
    color:#2c3e50;
    font-size:32px;
}

/* Box Class */
.box{
    border:1px solid #ccc;
    padding:16px;
    margin-top:20px;
}
</style>

</head>
<body>

<h1 id="header">Welcome to CSS Selectors</h1>

<p class="intro">
    This is an introduction paragraph styled using the <b>.intro</b> class.
</p>

<p>
    This is a normal paragraph styled using the element selector.
</p>

<p class="highlight">
    This paragraph is highlighted using the <b>.highlight</b> class.
</p>

<div class="box">
    <h2>Box Section</h2>
    <p>
        This content is inside the box. The box has a border and padding.
    </p
</div>

</body>
</html>
